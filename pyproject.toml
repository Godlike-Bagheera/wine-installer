[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-installer"
version = "2.6"
description = "Портативный Wine-лаунчер для Linux: игры, Minecraft, DXVK/Vulkan, шейдеры, миры"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Godlike-Bagheera" }]
# Ядро использует только стандартную библиотеку Python.
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
wine-launcher = "wine:main"

[tool.pytest.ini_options]
# Тесты — standalone-скрипты (python tests/test_x.py), а не pytest-наборы.
# Стандартный Python-сборщик отключён в tests/conftest.py (хук
# pytest_pycollect_makemodule -> None): импорт test_*.py = выполнение
# скрипта + sys.exit -> INTERNALERROR ещё на стадии collection. Реальные
# тесты отдаёт wrapper test_standalone_scripts из tests/conftest.py: он
# гоняет каждый tests/test_*.py отдельным subprocess'ом и транслирует код
# возврата в успех/провал. Никаких --ignore здесь: conftest покрывает и
# `pytest`, и `pytest tests/`, и `pytest tests/test_x.py`.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402"]

[tool.setuptools]
packages = ["modules"]
py-modules = ["wine"]
